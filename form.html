<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/style-larger.css" media="screen and (min-width: 768px)">
  <script src="scripts/scripts.js" defer></script>
</head>
<body>
  <div class="form-container">
    <h1>Product Review</h1>
    <form method="get" action="review.html">
      <label for="product-name">Product Name</label>
      <select id="product-name" name="product-name" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset>
        <legend>Overall Rating</legend>
        <div class="rating">
          <input type="radio" id="rating-1" name="rating" value="1" required>
          <label for="rating-1">☆</label>
          <input type="radio" id="rating-2" name="rating" value="2">
          <label for="rating-2">☆☆</label>
          <input type="radio" id="rating-3" name="rating" value="3">
          <label for="rating-3">☆☆☆</label>
          <input type="radio" id="rating-4" name="rating" value="4">
          <label for="rating-4">☆☆☆☆</label>
          <input type="radio" id="rating-5" name="rating" value="5">
          <label for="rating-5">☆☆☆☆☆</label>
        </div>
      </fieldset>

      <label for="install-date">Date of Installation</label>
      <input type="date" id="install-date" name="install-date" required>

      <fieldset>
        <legend>Which features did you find useful in the product?</legend>
        <div>
          <input type="checkbox" id="durability" name="features" value="Durability">
          <label for="durability">Durability</label>
        </div>
        <div>
          <input type="checkbox" id="ease-of-use" name="features" value="Ease of Use">
          <label for="ease-of-use">Ease of Use</label>
        </div>
        <div>
          <input type="checkbox" id="performance" name="features" value="Performance">
          <label for="performance">Performance</label>
        </div>
        <div>
          <input type="checkbox" id="design" name="features" value="Design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <label for="review-text">Written Review (Optional)</label>
      <textarea id="review-text" name="review-text" rows="5"></textarea>

      <label for="user-name">Your Name (Optional)</label>
      <input type="text" id="user-name" name="user-name">

      <input type="submit" value="Post Review">
    </form>
  </div>
  <footer>
    <p>©2024 🌸 David Banda 🌸 Texas<br>Last Modification: 02/26/2024 13:56:10</p>
  </footer>
</body>
</html>
